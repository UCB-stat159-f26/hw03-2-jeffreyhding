[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tenniscareer"
version = "0.1.0"
description = "Retrieve and visualize tennis career match data from Tennis Abstract."
requires-python = ">=3.10"
dependencies = [
    "matplotlib",
    "pandas"
]
[project.optional-dependencies]
test = [
    "pytest"
]
